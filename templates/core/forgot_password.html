
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Forgot Password | BloodConnect</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(
                135deg,
                #8b0000,
                #d32f2f
            );

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .box {
            width: 90%;
            max-width: 420px;
            background: white;
            padding: 40px;
            border-radius: 18px;

            box-shadow:
                0 15px 40px rgba(0,0,0,0.25);
        }

        .icon {
            text-align: center;
            font-size: 52px;
            margin-bottom: 10px;
        }

        h1 {
            text-align: center;
            color: #b71c1c;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 28px;
            line-height: 1.5;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
            color: #333;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #ccc;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #c62828;
        }

        button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 8px;

            background: #c62828;
            color: white;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;
        }

        button:hover {
            background: #8e0000;
        }

        .message {
            background: #ffebee;
            color: #b71c1c;
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 15px;
            text-align: center;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #b71c1c;
            text-decoration: none;
            font-weight: bold;
        }

        .back:hover {
            text-decoration: underline;
        }

    </style>

</head>


<body>


<div class="box">


    <div class="icon">
        🔐
    </div>


    <h1>
        Forgot Password
    </h1>


    <p class="subtitle">

        Enter your Hospital ID and registered
        mobile number to reset your password.

    </p>


    {% if messages %}

        {% for message in messages %}

            <div class="message">
                {{ message }}
            </div>

        {% endfor %}

    {% endif %}


    <form method="POST">

        {% csrf_token %}


        <label>
            Hospital ID
        </label>

        <input
            type="text"
            name="hospital_id"
            placeholder="Enter Hospital ID"
            required
        >


        <label>
            Registered Mobile Number
        </label>

        <input
            type="text"
            name="contact_number"
            placeholder="Enter registered mobile number"
            maxlength="15"
            required
        >


        <button type="submit">

            Continue

        </button>


    </form>


    <a
        href="{% url 'hospital_login' %}"
        class="back">

        ← Back to Hospital Login

    </a>


</div>


</body>

</html>
