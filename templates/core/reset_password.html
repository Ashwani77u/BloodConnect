
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Reset Password | BloodConnect</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;

            background: linear-gradient(
                135deg,
                #8b0000,
                #d32f2f
            );

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .reset-box {
            width: 90%;
            max-width: 420px;

            background: white;

            padding: 40px;

            border-radius: 18px;

            box-shadow:
                0 15px 40px rgba(0,0,0,0.25);
        }

        .icon {
            text-align: center;

            font-size: 55px;

            margin-bottom: 10px;
        }

        h1 {
            text-align: center;

            color: #b71c1c;

            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;

            color: #666;

            margin-bottom: 28px;

            line-height: 1.5;
        }

        .hospital-name {
            text-align: center;

            background: #ffebee;

            color: #b71c1c;

            padding: 10px;

            border-radius: 8px;

            margin-bottom: 22px;

            font-weight: bold;
        }

        label {
            display: block;

            margin-bottom: 7px;

            font-weight: bold;

            color: #333;
        }

        input {
            width: 100%;

            padding: 13px;

            border: 1px solid #ccc;

            border-radius: 8px;

            margin-bottom: 20px;

            font-size: 15px;

            outline: none;
        }

        input:focus {
            border-color: #c62828;
        }

        button {
            width: 100%;

            padding: 13px;

            border: none;

            border-radius: 8px;

            background: #c62828;

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;
        }

        button:hover {
            background: #8e0000;
        }

        .message {
            background: #ffebee;

            color: #b71c1c;

            padding: 10px;

            border-radius: 6px;

            margin-bottom: 15px;

            text-align: center;
        }

        .back {
            display: block;

            text-align: center;

            margin-top: 20px;

            color: #b71c1c;

            text-decoration: none;

            font-weight: bold;
        }

        .back:hover {
            text-decoration: underline;
        }

    </style>

</head>


<body>


<div class="reset-box">


    <div class="icon">
        🔐
    </div>


    <h1>
        Reset Password
    </h1>


    <p class="subtitle">

        Create a new password for your
        hospital account.

    </p>


    <div class="hospital-name">

        🏥 {{ hospital.name }}

    </div>


    {% if messages %}

        {% for message in messages %}

            <div class="message">
                {{ message }}
            </div>

        {% endfor %}

    {% endif %}


    <form method="POST">

        {% csrf_token %}


        <label>
            New Password
        </label>

        <input
            type="password"
            name="password"
            placeholder="Enter new password"
            minlength="6"
            required
        >


        <label>
            Confirm New Password
        </label>

        <input
            type="password"
            name="confirm_password"
            placeholder="Confirm new password"
            minlength="6"
            required
        >


        <button type="submit">

            🔑 CHANGE PASSWORD

        </button>


    </form>


    <a
        href="{% url 'hospital_login' %}"
        class="back">

        ← Back to Hospital Login

    </a>


</div>


</body>

</html>
